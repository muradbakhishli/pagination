databaseChangeLog:
  - changeSet:
      id: create payments table
      author: Murad Bakhishli
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: from_account
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: to_account
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: numeric(16,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: payment_date
                  type: timestamp
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: transaction_number
                  type: varchar(64)
                  constraints:
                    nullable: false




